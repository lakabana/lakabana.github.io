<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Código QR de la carta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: "Nunito", system-ui, sans-serif;
      background: #e9e4da;
      color: #1e1a15;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .tarjeta {
      width: 100%;
      max-width: 380px;
      padding: 32px 24px 28px;
      border-radius: 20px;
      background: #14110e;
      color: #f6efe3;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    h1 { margin: 0 auto; width: 280px; }
    h1 img { display: block; width: 100%; height: auto; }
    .sub { margin: 10px 0 20px; color: #e3cf7d; letter-spacing: 2px; text-transform: uppercase; font-size: .8rem; font-weight: 700; }
    #qr { display: inline-block; padding: 14px; border-radius: 14px; background: #fff; }
    #qr img, #qr canvas { display: block; width: 240px; height: 240px; }
    .escanea { margin: 18px 0 4px; font-size: 1.15rem; font-weight: 700; }
    .url { margin: 0; color: #a89c88; font-size: .8rem; word-break: break-all; }
    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: #1e1a15;
      color: #fff;
      font: 700 1rem "Nunito", sans-serif;
      cursor: pointer;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .tarjeta { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      button { display: none; }
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1><img src="logo.png" alt="La Kabaña – Restaurante Pollería" width="720" height="424"></h1>
    <p class="sub">Carta digital</p>
    <div id="qr"></div>
    <p class="escanea">Escanea y mira nuestras cartas</p>
    <p class="url" id="url"></p>
  </div>
  <button onclick="window.print()">Imprimir</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // El QR apunta a la portada (index.html en la misma carpeta), donde se elige restaurante o pollería.
    const destino = new URL("./", location.href).href;
    document.getElementById("url").textContent = destino;
    new QRCode(document.getElementById("qr"), {
      text: destino,
      width: 480,
      height: 480,
      colorDark: "#14110e",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H,
    });
  </script>
</body>
</html>
