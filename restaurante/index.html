<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110e">
  <meta name="description" content="Carta de La Kabaña Restaurante: platos regionales, a la carta, marinos, sopas y bebidas. Jr. Independencia 570.">
  <meta property="og:title" content="La Kabaña Restaurante · Carta">
  <meta property="og:description" content="Platos regionales, a la carta, marinos, sopas y bebidas.">
  <meta property="og:image" content="https://lakabana.github.io/logo.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="853">
  <title>La Kabaña Restaurante · Carta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2314110e'/%3E%3Cpath d='M22 78C28 46 50 24 80 20C76 50 56 72 22 78Z' fill='%233a9a52'/%3E%3Cpath d='M22 78Q50 52 80 20' stroke='%23f2c14e' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="cabecera">
    <a class="volver" href="../">‹ Inicio</a>
    <h1 class="logo logo-carta"><img src="../logo.png" alt="" width="720" height="424"><span class="sr" id="nombre">La Kabaña</span></h1>
    <p class="eslogan" id="eslogan">Sabores de la Amazonía</p>
  </header>

  <nav class="categorias" id="categorias" aria-label="Categorías de la carta"></nav>

  <div class="buscador">
    <label class="buscador-caja">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr">Buscar en la carta</span>
      <input id="buscar" type="search" placeholder="Buscar un plato o bebida…" autocomplete="off">
    </label>
  </div>

  <main id="carta" class="carta"></main>
  <p id="sin-resultados" class="sin-resultados" hidden>No encontramos ese plato. Prueba con otra palabra.</p>

  <footer class="pie" id="pie">
    <p class="pie-nota">Precios en soles (S/).</p>
  </footer>

  <script src="../redes.js"></script>
  <script src="../app.js"></script>
</body>
</html>
