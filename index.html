<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110e">
  <meta name="description" content="La Kabaña: elige la carta del restaurante o de la pollería. Jr. Independencia 570.">
  <meta property="og:title" content="La Kabaña · Cartas">
  <meta property="og:description" content="La Kabaña Restaurante y La Kabaña Pollería.">
  <meta property="og:image" content="https://lakabana.github.io/logo.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="853">
  <title>La Kabaña · Cartas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2314110e'/%3E%3Cpath d='M22 78C28 46 50 24 80 20C76 50 56 72 22 78Z' fill='%233a9a52'/%3E%3Cpath d='M22 78Q50 52 80 20' stroke='%23f2c14e' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera">
    <h1 class="logo logo-portada"><img src="logo.png" alt="La Kabaña – Restaurante Pollería" width="720" height="424"></h1>
    <p class="eslogan">Elige tu carta</p>
  </header>

  <main class="opciones">
    <a class="opcion" href="restaurante/">
      <span class="opcion-icono" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="currentColor">
          <path d="M13 4v14a5 5 0 0 0 4 4.9V44h4V22.9A5 5 0 0 0 25 18V4h-3v12h-1.5V4h-3v12H16V4z"/>
          <path d="M35 4c-4 2-6.5 8-6.5 14v6h4v20h4V4z"/>
        </svg>
      </span>
      <span class="opcion-texto">
        <span class="opcion-marca">La Kabaña</span>
        <span class="opcion-nombre">Restaurante</span>
        <span class="opcion-detalle">Platos regionales, a la carta, marinos y más</span>
      </span>
      <span class="opcion-flecha" aria-hidden="true">›</span>
    </a>

    <a class="opcion" href="polleria/">
      <span class="opcion-icono" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="currentColor">
          <ellipse cx="29" cy="19" rx="15" ry="11" transform="rotate(-45 29 19)"/>
          <path d="M21 27 10 38" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          <circle cx="7" cy="37" r="3.2"/>
          <circle cx="11" cy="41" r="3.2"/>
        </svg>
      </span>
      <span class="opcion-texto">
        <span class="opcion-marca">La Kabaña</span>
        <span class="opcion-nombre">Pollería</span>
        <span class="opcion-detalle">Pollos a la brasa</span>
      </span>
      <span class="opcion-flecha" aria-hidden="true">›</span>
    </a>
  </main>

  <section class="seguir" id="seguir" hidden>
    <h2 class="seguir-titulo">Síguenos en redes</h2>
    <div id="redes"></div>
  </section>

  <script src="redes.js"></script>
  <script>
    // Las redes de la portada son las que se cargan en el editor, en la carta del Restaurante.
    fetch("restaurante/menu.json", { cache: "no-cache" })
      .then((r) => r.json())
      .then((datos) => {
        const redes = pintarRedes(datos.restaurante);
        if (!redes) return;
        document.getElementById("redes").replaceWith(redes);
        document.getElementById("seguir").hidden = false;
      })
      .catch(() => {});
  </script>
</body>
</html>
